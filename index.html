    <script>
      // Runtime constraint: HMR is disabled in AI Studio. Suppress benign WebSocket/HMR disconnect events.
      window.addEventListener('error', function(event) {
        if (event && (
          (event.message && (event.message.includes('WebSocket') || event.message.includes('@vite/client') || event.message.includes('ModuleRunnerTransport'))) ||
          (event.filename && event.filename.includes('@vite/client'))
        )) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && String(event.reason).includes('WebSocket')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
